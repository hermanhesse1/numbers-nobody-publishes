name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python code/estimates.py && python code/backtest.py > output/backtest.txt
      - run: git diff --exit-code output/sample_estimates.csv output/backtest.txt
      - run: python code/check.py
